<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    body {
        background-color: #000000;
        color: white;
    }
    pre{
        color: #22ca30;
        background-color: #ececec;
        font-size: 400px;
    }
    #hello{
        color: #d5ff19;
    }
    p{
        color: aquamarine;
    }
    #hello{
        color: #d5ff19;
    }
</style>
</head>
<body>
    <p id="hello">Hello World</p>
    <p>This is SOhaib AHmed Jan</p>
    <form>
        <pre style="text-align: center; font-size: xx-large; font-weight: 600;"> Novell Services Login</pre>
        <table>
                <tr>
                    <td>
                        <label for="username">Username:</label>
        
                    </td>
                    <td>
                        <input type="text" id="username" name="username" required placeholder="Enter your username">
                    </td>
                </tr>
                <tr>
                    <td>
                        <label for="password">Password:</label>   
                    </td>
                    <td>
                        <input type="password" id="password" name="password" required placeholder="Enter your password">
                    </td>
                </tr>
                <tr>
                    <td>
                        <label for="city_of_Employement">City of Employment:</label>
                    </td>
                    <td>
                        <input type="text" id="city_of_Employement" name="city_of_Employement   " required placeholder="Enter your city">
                    </td>
                </tr>
                <tr>
                    <td>
                        <label for="web_server">Web Server :</label>
                    </td>
                    <td>
                        <select id="web_server" required>
                             <option value="" disabled selected>Select an option</option>
                             <option value="Apache_HTTP_Server">Apache HTTP Server</option>
                              <option value="Microsoft_Internet_Information_Services">Microsoft Internet Information Services (IIS)</option>
                            <option value="NGINX">NGINX</option>
                        </select>
                    </td>
                </tr>
              
                <tr>
                    <td>
                        Please Specify Your Role
                    </td>
                    
                    <td>
                        <input type="radio" id="admin" value="admin">
                        <label for="admin">Admin</label>    
                        <br>
                        <input type="radio" id="engineer" value="engineer">
                        <label for="engineer">Engineer</label>
                        <br>
                        <input type="radio" id="manager" value="manager">
                        <label for="manager">Manager</label>
                        <br>
                        <input type="radio" id="guest" value="guest">
                        <label for="guest">Guest</label>
                    
                    </td>
                </tr>
                <tr>
                    <td>
                        Single Sign On To The Following Services
                    </td>
                    
                    <td>
                        <input type="checkbox" name="p" id="mad"  value="mad">
                        <label for="mad" name="p">Mad</label>
                        <br>
                        <input type="checkbox" name="p" id="payroll" value="payroll">
                        <label for="payroll" name="p">Payroll</label>
                        <br>
                        <input type="checkbox" id="selfservice" value="selfservice" name = "p">
                        <label for="selfservice">Self-Service</label>
                        
                    </td>
                </tr>
                <tr>
                    <td colspan="2" style="text-align: center;">
                        <button type="submit">Login</button>
                        <button type="reset">Reset</button>

                    </td>
                </tr>

        </table>
      
      
    
        
            
           
        
    </form>
</body>
</html>
